name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install worker dependencies
        run: pnpm install --filter @get-on/sites-worker... --filter @get-on/api-worker... --no-frozen-lockfile --config.link-workspace-packages=true --config.prefer-workspace-packages=true

      - name: Typecheck & test sites worker
        run: |
          pnpm --filter @get-on/sites-worker run typecheck
          pnpm --filter @get-on/sites-worker run test

      - name: Typecheck & test API worker
        run: |
          pnpm --filter @get-on/api-worker run typecheck
          pnpm --filter @get-on/api-worker run test

      - name: Deploy sites worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @get-on/sites-worker run deploy

      - name: Deploy API worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @get-on/api-worker run deploy
